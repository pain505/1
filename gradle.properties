# 取件码管家 — Gradle 属性
# 注意：本文件不得写 android.suppressUnsupportedCompileSdk（按要求省略）。

# --- JVM ---
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# --- AndroidX / Jetifier ---
# 本项目只用 Android 平台 API，不引入任何 AndroidX / 第三方依赖。
# AGP 8 的硬性约束是 (useAndroidX=false && enableJetifier=true) 组合会直接报错，
# 这里两个都显式写 false，既表明意图，也避免 AGP 8 的 support-library 兼容检查报警。
android.useAndroidX=false
android.enableJetifier=false

# 非传递 R 类（AGP 8 默认值，显式写出便于自文档化）
android.nonTransitiveRClass=true

# 工程路径含中文/空格时跳过 AGP 的路径合法性检查
android.overridePathCheck=true

# --- Kotlin ---
kotlin.code.style=official

# --- Gradle 性能 ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# ============================================================================
# 网络受限时的应急开关（默认全部注释掉，需要时手动打开）
# ----------------------------------------------------------------------------
# 1) AAPT2 无法从 Maven 下载（com.android.tools.build:aapt2:8.5.2-<build>）时，
#    直接用 Android SDK build-tools 里自带的 aapt2.exe（改成你自己的 SDK 路径）：
# android.aapt2FromMavenOverride=C:/Android/Sdk/build-tools/34.0.0/aapt2.exe
#
# 2) 所有仓库都连不上时，配合已预热的缓存离线构建（命令行加 --offline）：
# org.gradle.offline=true
#
# 3) 若走本机 Node 代理转发 HTTPS（localhost:8888），打开这两个：
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=8888
# systemProp.https.nonProxyHosts=localhost|127.0.0.1
# ============================================================================
